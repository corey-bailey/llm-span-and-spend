global:
  scrape_interval: 15s

otlp:
  promote_resource_attributes:
    - service.name
    - service.version
    - host.name

storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  # The Collector's own health: accepted, refused, and dropped spans; queue size.
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8888"]
