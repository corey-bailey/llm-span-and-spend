# Phase 3 stack: a dedicated OpenTelemetry Collector in front of Tempo, Loki, and Prometheus.
# (Phases 1-2 used the all-in-one grafana/otel-lgtm image; versions below match its 2026-09 build.)
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    mem_limit: 512m   # gives memory_limiter's 80% / 20% a real ceiling (cgroup), not the host's RAM
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      TRACE_SAMPLE_PERCENT: ${TRACE_SAMPLE_PERCENT:-10}
      SLOW_TRACE_MS: ${SLOW_TRACE_MS:-20000}
    ports:
      # All ports bind to loopback: this stack has no auth and is for a local machine only.
      - "127.0.0.1:4317:4317"     # OTLP gRPC from the agent
      - "127.0.0.1:4318:4318"     # OTLP HTTP
      - "127.0.0.1:13133:13133"   # health check
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # set in .env to change
      # Local demo: open the dashboard with no login and no clicks. Viewers cannot edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/catalog-agent.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"   # loopback only; 3001 avoids a local Grafana on 3000
    depends_on: [tempo, loki, prometheus]
