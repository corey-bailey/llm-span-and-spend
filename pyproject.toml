[project]
name = "llm-otel-reference"
version = "0.1.0"
description = "Reference for observing a Claude tool-using agent with OpenTelemetry and the Grafana LGTM stack"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
